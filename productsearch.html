<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Search</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ✅ Load firebase init helper (NO secrets in repo) -->
  <script src="/js/firebaseConfig.js"></script>

  <!-- ZXing Barcode/QR Scanner -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <link rel="icon" href="/images/truly_favicon_o1.png" type="image/png" />

  <style>
    #clearSearchBtn {
      position: absolute;
      right: 3rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #888;
      font-size: 1.2rem;
      display: none;
    }
    .card-img-top {
      margin-top: 8px;
      height: 120px;
      object-fit: contain;
    }
    .card-body { text-align: center; }
    #qrModal video { width: 100%; }
    .btn-mini-group { display: inline-flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="input-group mb-4 position-relative">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by Title or Barcode" />
      <span id="clearSearchBtn" onclick="clearSearch()">&times;</span>
      <button class="btn btn-outline-secondary" type="button" onclick="startScan()" title="Scan Barcode or QR">
        <i class="bi bi-upc-scan"></i>
      </button>
    </div>

    <div class="row" id="cardContainer">
      <div class="text-muted">Loading products...</div>
    </div>
  </div>

  <!-- Scan Modal -->
  <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Scan Barcode / QR</h5>
          <div class="d-flex align-items-center">
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" onclick="switchCamera()">🔁 Switch Camera</button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopScan()"></button>
          </div>
        </div>
        <div class="modal-body">
          <video id="qr-video" style="width: 100%; height: auto;"></video>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ✅ Firestore db (init after Firebase ready)
    let db;

    let allData = [];
    let codeReader;
    let videoDevices = [];
    let selectedDeviceId = null;
    let currentDeviceIndex = 0;

    async function loadData() {
      const snapshot = await db.collection("pricetaglabel").get();
      allData = snapshot.docs.map(doc => doc.data());
      renderCards(allData);
      document.getElementById("searchInput").addEventListener("input", searchRecords);
    }

    // --------- helpers for short link ----------
    const SHORT_LINK_PREFIX = "https://trulymarket.ca/products/";

    function extractHandleFromUrl(url) {
      if (!url) return "";
      try {
        const u = new URL(url);
        const m = u.pathname.match(/\/products\/([^\/?#]+)/i);
        return m ? decodeURIComponent(m[1]) : "";
      } catch {
        const m = (url || "").match(/\/products\/([^\/?#]+)/i);
        return m ? decodeURIComponent(m[1]) : "";
      }
    }

    function resolveHandle(doc) {
      const direct =
        (typeof doc.Handle === "string" && doc.Handle.trim()) ||
        (typeof doc.handle === "string" && doc.handle.trim());
      if (direct) return direct.trim();

      const fromUrl = extractHandleFromUrl(doc["Product URL"] || doc.ProductURL || "");
      return fromUrl || "";
    }

    async function copyShortLink(evt) {
      const btn = evt.currentTarget;
      const url = btn?.dataset?.url;
      if (!url) { alert("Short link unavailable."); return; }

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
        } else {
          const ta = document.createElement("textarea");
          ta.value = url;
          ta.setAttribute("readonly", "");
          ta.style.position = "absolute";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-clipboard-check"></i> Copied!';
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = original;
          btn.disabled = false;
        }, 1500);
      } catch (e) {
        alert("Unable to copy. " + e);
      }
    }
    // -------------------------------------------

    function renderCards(data) {
      const container = document.getElementById("cardContainer");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `<div class="text-muted">No results found.</div>`;
        return;
      }

      data.forEach(doc => {
        const col = document.createElement("div");
        col.className = "col-6 col-md-4 col-lg-3 mb-4";

        const price = doc.Price ? new Intl.NumberFormat("en-CA", {
          style: "currency", currency: "CAD"
        }).format(doc.Price) : "";

        const handle = resolveHandle(doc);
        const shortUrl = handle ? (SHORT_LINK_PREFIX + handle.trim()) : "";

        const viewBtn = doc["Product URL"]
          ? `<a href="${doc["Product URL"]}" target="_blank" class="btn btn-sm btn-outline-primary">
               <i class="bi bi-box-arrow-up-right"></i> View
             </a>`
          : "";

        const copyBtn = shortUrl
          ? `<button type="button"
                    class="btn btn-sm btn-outline-secondary"
                    data-url="${shortUrl}"
                    onclick="copyShortLink(event)">
               <i class="bi bi-clipboard"></i> Copy Short Link
             </button>`
          : "";

        col.innerHTML = `
          <div class="card h-100 shadow-sm">
            ${doc["Image URL"] ? `<img src="${doc["Image URL"]}" class="card-img-top" alt="Image">` : ""}
            <div class="card-body">
              <h6 class="fw-bold">${doc.ProductNameEng || ""}</h6>
              <div class="text-primary">${doc.ProductNameChi || ""}</div>
              <div class="small text-muted mb-2">${doc.ProductDesc || ""}</div>
              <div class="mb-2"><strong>${price}</strong></div>
              <div class="btn-mini-group">
                ${viewBtn}
                ${copyBtn}
              </div>
              ${!shortUrl ? `<div class="mt-2 small text-muted">No handle found</div>` : ""}
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    function searchRecords() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      document.getElementById("clearSearchBtn").style.display = keyword ? "inline" : "none";

      const filtered = keyword
        ? allData.filter(doc =>
            (doc.Title || "").toLowerCase().includes(keyword) ||
            (doc.Barcode || "").toLowerCase().includes(keyword))
        : [...allData];

      renderCards(filtered);
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").style.display = "none";
      searchRecords();
    }

    async function startScan() {
      const modal = new bootstrap.Modal(document.getElementById("qrModal"));
      modal.show();

      const videoElement = document.getElementById("qr-video");

      codeReader = new ZXing.BrowserMultiFormatReader();
      videoDevices = await codeReader.listVideoInputDevices();

      if (selectedDeviceId === null) {
        const backCam = videoDevices.find(d => /back|rear|environment/i.test(d.label));
        selectedDeviceId = backCam?.deviceId || videoDevices[0]?.deviceId;
        currentDeviceIndex = videoDevices.findIndex(d => d.deviceId === selectedDeviceId);
      }

      try {
        await codeReader.decodeFromVideoDevice(selectedDeviceId, videoElement, (result, err) => {
          if (result) {
            const code = result.getText();
            document.getElementById("searchInput").value = code;
            searchRecords();
            stopScan();
            modal.hide();
          }
        });
      } catch (e) {
        alert("Camera error: " + e);
        stopScan();
        modal.hide();
      }
    }

    async function switchCamera() {
      if (!videoDevices.length) return;

      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      selectedDeviceId = videoDevices[currentDeviceIndex].deviceId;

      if (codeReader) await codeReader.reset();
      setTimeout(() => { startScan(); }, 300);
    }

    function stopScan() {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }
    }

    fetch("/navbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("navbarContainer").innerHTML = html;
        document.querySelectorAll(".nav-link").forEach(link => {
          if (link.href.endsWith("productsearch.html")) {
            link.classList.add("fw-bold", "text-decoration-underline");
          }
        });
      });

    // ✅ init: Firebase first, then loadData
    (async function init() {
      try {
        db = await window.initFirebase();
        await loadData();
      } catch (e) {
        console.error(e);
        alert("Firebase 初始化失敗：\n" + (e?.message || e));
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
