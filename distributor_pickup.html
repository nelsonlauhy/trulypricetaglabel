<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分銷商提貨管理 · Truly</title>

  <!-- Favicon -->
  <link rel="icon" href="/images/truly_favicon_o1.png" type="image/png" />

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Page CSS -->
  <link href="/css/distributor_pickup.css" rel="stylesheet" />

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- ZXing (Barcode/QR) -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="page-title">
        <i class="bi bi-box-seam"></i>
        <h4 class="m-0">分銷商提貨管理</h4>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="/distributor-master.html" target="_blank">
          <i class="bi bi-people"></i> 分銷商主檔
        </a>
        <button class="btn btn-primary" id="btnOpenNew">
          <i class="bi bi-plus-lg"></i> 新增提貨記錄
        </button>
        <button class="btn btn-outline-secondary" id="btnExportCSV">
          <i class="bi bi-filetype-csv"></i> 匯出 CSV
        </button>
      </div>
    </div>

    <div class="filters-inline mb-3">

      <!-- 搜尋（縮窄寬度） -->
      <div class="filters-search flex-grow-1">
        <div class="input-group position-relative">
          <input id="searchInput" type="text" class="form-control"
                placeholder="搜尋：分銷商／公司／聯絡／電話／電郵／備註／貨品" />
          <span id="clearSearchBtn">&times;</span>
          <button class="btn btn-outline-secondary" type="button"
                  data-bs-toggle="modal" data-bs-target="#scanModal"
                  title="掃描條碼加入貨品至草稿">
            <i class="bi bi-upc-scan"></i>
          </button>
        </div>
      </div>

      <div class="filters-item">
        <select id="statusFilter" class="form-select">
          <option value="ALL">狀態：全部</option>
          <option value="OPEN">未提貨</option>
          <option value="PICKED">已提貨</option>
          <option value="CANCELLED">已取消</option>
        </select>
      </div>

      <div class="filters-item">
        <div class="input-group">
          <span class="input-group-text">開始</span>
          <input id="dateFrom" type="date" class="form-control" />
        </div>
      </div>

      <div class="filters-item">
        <div class="input-group">
          <span class="input-group-text">結束</span>
          <input id="dateTo" type="date" class="form-control" />
        </div>
      </div>
    </div>



    <!-- 統計摘要 -->
    <div class="mb-3 small text-muted" id="summaryBar">載入中…</div>

    <!-- 清單 -->
    <div id="listContainer" class="list-group shadow-sm">
      <div class="list-group-item text-muted">載入中…</div>
    </div>
  </div>

  <!-- 新增／編輯 Modal -->
  <div class="modal fade" id="pickupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <form id="pickupForm">
          <div class="modal-header">
            <h5 class="modal-title" id="pickupModalTitle">新增提貨記錄</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <!-- 可收合：基本資料 -->
            <details class="summary-block mb-3" open>
              <summary class="h6 mb-2"><i class="bi bi-chevron-right chev"></i> 基本資料</summary>
              <div class="row g-3">
                <input type="hidden" id="docId" />
                <!-- 分銷商下拉選擇 -->
                <div class="col-md-6">
                  <label class="form-label required">分銷商</label>
                  <select id="distributorSelect" class="form-select" required></select>
                  <div class="form-text">來源：distributors 主檔（只顯示啟用的記錄）。</div>
                </div>
                <div class="col-md-3">
                  <label class="form-label required">提貨日期</label>
                  <input id="pickupDate" type="date" class="form-control" required />
                </div>
                <div class="col-md-3">
                  <label class="form-label required">狀態</label>
                  <select id="status" class="form-select" required>
                    <option value="OPEN">未提貨</option>
                    <option value="PICKED">已提貨</option>
                    <option value="CANCELLED">已取消</option>
                  </select>
                </div>

                <!-- 由主檔帶出（唯讀） -->
                <div class="col-md-3">
                  <label class="form-label">聯絡人</label>
                  <input id="distContact" type="text" class="form-control" placeholder="—" readonly />
                </div>
                <div class="col-md-3">
                  <label class="form-label">電話</label>
                  <input id="distTel" type="text" class="form-control" placeholder="—" readonly />
                </div>
                <div class="col-md-6">
                  <label class="form-label">電郵</label>
                  <input id="distEmail" type="text" class="form-control" placeholder="—" readonly />
                </div>

                <div class="col-12">
                  <label class="form-label">備註</label>
                  <input id="notes" type="text" class="form-control" placeholder="可輸入車牌、付款方式或其他備註" />
                </div>
              </div>
            </details>

            <!-- Sticky 搜尋區（固定在頂） -->
            <div class="sticky-search">
              <label class="form-label mb-1"><i class="bi bi-bag"></i> 提貨貨品</label>
              <div class="d-flex gap-2 mb-1">
                <div class="prod-search-wrap flex-grow-1">
                  <input id="prodSearch" type="text" class="form-control" placeholder="輸入英文/中文品名或條碼 (≥2字開始搜尋)">
                  <div id="prodResults" class="prod-results"></div>
                </div>
                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#scanModal">
                  <i class="bi bi-upc-scan"></i>
                </button>
              </div>
              <div class="form-text">點選結果會新增到下方清單；品名/條碼鎖定，僅可修改數量。</div>
            </div>

            <div class="table-responsive mt-2">
              <table class="table table-sm align-middle table-items">
                <thead class="table-light">
                  <tr>
                    <th style="width:30%">貨品名稱（唯讀）</th>
                    <th style="width:20%">條碼（唯讀）</th>
                    <th style="width:12%">數量</th>
                    <th style="width:18%">照片</th>
                    <th style="width:20%">操作</th>
                  </tr>
                </thead>
                <tbody id="itemsTbody"></tbody>
              </table>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 掃碼 Modal -->
  <div class="modal fade" id="scanModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">掃描條碼／QR</h5>
          <div class="d-flex align-items-center">
            <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="btnSwitchCam">🔁 轉鏡頭</button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" id="btnScanClose"></button>
          </div>
        </div>
        <div class="modal-body">
          <video id="qr-video" style="width:100%;height:auto;"></video>
          <div class="form-text">掃描後會在貨品清單新增一行，並嘗試從商品庫填充名稱與圖片。</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App Config & Logic -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/distributor_pickup.js" defer></script>
</body>
</html>
