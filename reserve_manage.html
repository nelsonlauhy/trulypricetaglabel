<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顧客預留 / 補貨管理</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <link rel="icon" href="/images/truly_favicon_o1.png" type="image/png" />

  <style>
    body { background:#f8f9fa; }
    .toolbar .form-select, .toolbar .form-control { height: 38px; }
    .truncate-1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .truncate-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .thumb { width:56px; height:56px; object-fit:contain; background:#fff; border:1px solid #eee; border-radius:.5rem; }
    .list-group-item { padding: .75rem; }
    .status-badge { text-transform: capitalize; }
    .small-muted { font-size:.85rem; color:#6c757d; }
    .sticky-actions { position:sticky; bottom:0; background:#fff; border-top:1px solid #eee; padding:.5rem; }

    /* Product search dropdown (for modal product picker) */
    .prod-search-wrap { position: relative; }
    .prod-results {
      position: absolute; z-index: 1080; left:0; right:0; top:100%;
      background:#fff; border:1px solid rgba(0,0,0,.125); border-top:none;
      max-height: 300px; overflow:auto; box-shadow: 0 6px 18px rgba(0,0,0,.08);
      display:none;
    }
    .prod-item { padding:.5rem .75rem; cursor:pointer; }
    .prod-item:hover, .prod-item.active { background:#f1f3f5; }
    .prod-badge { font-size:.75rem; }
    .form-text-compact { margin-top:.25rem; font-size:.8rem; color:#6c757d; }

    /* Mobile modal scroll fix */
    .modal .modal-body { -webkit-overflow-scrolling: touch; }
    @media (max-width: 576px){
      .modal .modal-body{ max-height: calc(100vh - 160px); overflow:auto; }
    }

    .badge:empty { display: none !important; }
    .qty-badge{ font-size: 1rem; padding: .4em .65em; line-height: 1; }

    /* 讓 Modal 在任何視窗高度都可滾動顯示完整內容 */
    .modal .modal-content{
      max-height: 92vh;            /* 整體高度上限 */
      display: flex;
      flex-direction: column;
    }
    .modal .modal-header,
    .modal .modal-footer{
      flex-shrink: 0;               /* 標頭/標尾固定高度，不被擠壓 */
    }
    .modal .modal-body{
      overflow: auto;               /* 關鍵：出現垂直卷軸 */
      max-height: calc(92vh - 3.5rem - 3.5rem); /* 92vh 扣掉 header/footer (~3.5rem*2) */
      -webkit-overflow-scrolling: touch;       /* iOS 慣性滑動 */
    }

    /* 超細高度時再保險一層（例如 600px 以下） */
    @media (max-height: 600px){
      .modal .modal-content{ max-height: 96vh; }
      .modal .modal-body{ max-height: calc(96vh - 3.5rem - 3.5rem); }
    }

  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <div class="container py-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h4 class="mb-0">顧客預留 / 補貨管理</h4>
      <div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editModal" onclick="openCreate()">
          <i class="bi bi-plus-lg"></i> 新增紀錄
        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar row g-2 mb-2">
      <!-- 新增：只搜產品 -->
      <div class="col-12 col-md-3">
        <input id="kwProduct" type="text" class="form-control"
               placeholder="只搜產品：產品名 / 條碼 (e.g. omega-3)"
               oninput="applyFilters()">
      </div>
      <!-- 原有：關鍵字（不包含產品欄） -->
      <div class="col-12 col-md-3">
        <input id="kw" type="text" class="form-control"
               placeholder="搜尋：客戶 / 電話 / Email / 備註 / reserveID / 來源 / 經手 / ETA"
               oninput="applyFilters()">
      </div>
      <div class="col-6 col-md-2">
        <select id="typeFilter" class="form-select" onchange="applyFilters()">
          <option value="">全部類型</option>
          <option value="reserve">顧客預留</option>
          <option value="restock">補貨請求</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="statusFilter" class="form-select" onchange="applyFilters()">
          <option value="">全部狀態</option>
          <option value="open">Open</option>
          <option value="ordered">Ordered</option>
          <option value="received">Received</option>
          <option value="closed">Closed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="priorityFilter" class="form-select" onchange="applyFilters()">
          <option value="">優先度</option>
          <option value="high">High</option>
          <option value="normal">Normal</option>
        </select>
      </div>
      <div class="col-6 col-md-12 col-lg-3 text-end">
        <button class="btn btn-outline-secondary me-1" onclick="refreshList()"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-outline-secondary" onclick="exportCSV()"><i class="bi bi-filetype-csv"></i> 匯出</button>
      </div>
    </div>

    <!-- Totals bar -->
    <div id="statsBar" class="d-flex justify-content-between align-items-center mb-2">
      <div class="small text-muted">顯示結果</div>
      <div>
        <span class="badge text-bg-secondary me-1">項目：<span id="statItems" class="fw-bold">0</span></span>
        <span class="badge text-bg-primary">總數量：<span id="statQty" class="fw-bold">0</span></span>
      </div>
    </div>

    <!-- List -->
    <div id="listContainer" class="list-group shadow-sm">
      <div class="list-group-item text-muted">載入中…</div>
    </div>

    <div class="sticky-actions d-flex gap-2 justify-content-end mt-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="bulkChangeStatus('open')">批次設為 Open</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="bulkChangeStatus('ordered')">批次設為 Ordered</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="bulkChangeStatus('received')">批次設為 Received</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="bulkChangeStatus('closed')">批次設為 Closed</button>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-md-down">
      <div class="modal-content">
        <form id="editForm" onsubmit="saveRecord(event)" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">新增紀錄</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="docId">
            <div class="row g-3">
              <div class="col-6 col-md-3">
                <label class="form-label">類型</label>
                <select id="type" class="form-select" required>
                  <option value="reserve">顧客預留</option>
                  <option value="restock">補貨請求</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">狀態</label>
                <select id="status" class="form-select" required>
                  <option value="open">Open</option>
                  <option value="ordered">Ordered</option>
                  <option value="received">Received</option>
                  <option value="closed">Closed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">優先度</label>
                <select id="priority" class="form-select">
                  <option value="normal">Normal</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">來源</label>
                <select id="source" class="form-select">
                  <option value="store">Store</option>
                  <option value="whatsapp">WhatsApp</option>
                  <option value="LINE">LINE</option>
                  <option value="Wechat">Wechat</option>
                  <option value="SMS">SMS</option>
                  <option value="Phone">Phone</option>
                  <option value="SMS">SMS</option>
                </select>
              </div>

              <!-- Product search (in modal) -->
              <div class="col-12">
                <label class="form-label">產品搜尋</label>
                <div class="prod-search-wrap">
                  <input id="prodSearch" type="text" class="form-control" placeholder="輸入英文/中文品名或條碼 (≥2字開始搜尋)">
                  <div id="prodResults" class="prod-results"></div>
                </div>
                <div class="form-text-compact">點選結果可自動填入「產品名稱 / 條碼」。</div>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">產品名稱</label>
                <input id="productTitle" type="text" class="form-control" placeholder="Product Title">
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label">條碼</label>
                <input id="barcode" type="text" class="form-control" placeholder="Barcode">
              </div>

              <div class="col-6 col-md-3">
                <label class="form-label">數量</label>
                <input id="qty" type="number" min="1" step="1" class="form-control" value="1" required>
              </div>

              <div class="col-6 col-md-4">
                <label class="form-label">客戶姓名 <span class="text-danger">*</span></label>
                <input id="customerName" type="text" class="form-control" placeholder="客戶名稱" required>
                <div class="invalid-feedback">請填寫客戶姓名</div>
              </div>
              <div class="col-6 col-md-4">
                <label class="form-label">電話</label>
                <input id="phone" type="text" class="form-control" placeholder="電話">
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">客戶 Email</label>
                <input id="email" type="email" class="form-control" placeholder="email@example.com">
              </div>

              <div class="col-6 col-md-4">
                <label class="form-label">預計到貨</label>
                <input id="etaDate" type="date" class="form-control">
              </div>
              <div class="col-6 col-md-4">
                <label class="form-label">經手員工 <span class="text-danger">*</span></label>
                <input id="staff" type="text" class="form-control" placeholder="Staff" required>
                <div class="invalid-feedback">請填寫經手員工</div>
              </div>

              <div class="col-12">
                <label class="form-label">備註</label>
                <textarea id="notes" rows="3" class="form-control" placeholder="Notes"></textarea>
              </div>

              <div class="col-12 small-muted">
                產品圖片與連結：會自動以 <code>barcode</code> 嘗試關聯 <code>pricetaglabel</code>（若找到）。
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div class="me-auto small text-muted" id="auditInfo"></div>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal fade" id="confirmDelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">刪除確認</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">確定要刪除此紀錄？此動作無法還原。</div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-danger" id="btnDoDelete">刪除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyCy3fmE6jjoju1u5Zv6PQbSuHq6718zNcE",
      authDomain: "trulymarket-c25b6.firebaseapp.com",
      projectId: "trulymarket-c25b6",
      storageBucket: "trulymarket-c25b6.firebasestorage.app",
      messagingSenderId: "810610286008",
      appId: "1:810610286008:web:847f3bc2c441e103a1434d",
      measurementId: "G-KWN9XQD8K5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ===== Globals =====
    const COL = "cust_reservations";
    const PRODUCT_COL = "pricetaglabel";
    const SHORT_LINK_PREFIX = "https://trulymarket.ca/products/";
    let rawList = [];
    let viewList = [];
    let selectedIds = new Set();
    let delTargetId = null;

    // Product cache for search (modal)
    let productsCache = [];
    let prodActiveIndex = -1;

    // navbar 高亮
    fetch("/navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbarContainer").innerHTML = html;
        document.querySelectorAll(".nav-link").forEach(link => {
          if (link.href.endsWith("reserve_manage.html")) {
            link.classList.add("fw-bold","text-decoration-underline");
          }
        });
      });

    // ===== Helpers =====
    function extractHandleFromUrl(url) {
      if (!url) return "";
      try {
        const u = new URL(url);
        const m = u.pathname.match(/\/products\/([^\/?#]+)/i);
        return m ? decodeURIComponent(m[1]) : "";
      } catch {
        const m = (url || "").match(/\/products\/([^\/?#]+)/i);
        return m ? decodeURIComponent(m[1]) : "";
      }
    }
    function resolveHandle(p) {
      const direct = (typeof p.Handle==="string" && p.Handle.trim()) || (typeof p.handle==="string" && p.handle.trim());
      if (direct) return direct.trim();
      const fromUrl = extractHandleFromUrl(p["Product URL"] || p.ProductURL || "");
      return fromUrl || "";
    }

    // type & status & qty badges
    function typeBadge(t) {
      if (!t) return "";
      const isRestock = String(t).toLowerCase() === "restock";
      const label = isRestock ? "補貨" : "預留";
      const cls = isRestock ? "text-bg-warning" : "text-bg-info";
      return `<span class="badge ${cls} border">${label}</span>`;
    }
    function qtyBadge(q) {
      const n = Number(q || 1);
      return `<span class="badge bg-light text-dark qty-badge fw-bold">x${n}</span>`;
    }
    function statusBadge(s) {
      const map = { open:"secondary", ordered:"info", received:"primary", closed:"success", cancelled:"dark" };
      const cls = map[s] || "secondary";
      return `<span class="badge bg-${cls} status-badge">${s}</span>`;
    }

    async function lookupProductByBarcode(barcode) {
      if (!barcode) return null;
      const q = await db.collection(PRODUCT_COL).where("Barcode","==", String(barcode)).limit(1).get();
      if (q.empty) return null;
      const d = q.docs[0].data();
      const handle = resolveHandle(d);
      const shortUrl = handle ? (SHORT_LINK_PREFIX + handle) : "";
      return { imageUrl: d["Image URL"] || "", productUrl: d["Product URL"] || d.ProductURL || "", shortUrl };
    }

    // ===== reserveID generator =====
    function genReserveID() {
      const t = Date.now().toString(36).toUpperCase();
      const rnd = Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
      return `R${t}${rnd}`;
    }

    // ===== Normalization =====
    function normalizeForSearch(s){
      return String(s||"")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[–—−]/g, "-")
        .replace(/\s+/g, " ")
        .trim();
    }

    // 專供「只搜產品」的 hay（產品名＋條碼）
    function recordToHayProduct(r){
      return normalizeForSearch(
        [ r.productTitle || "", r.barcode || "" ].join(" ")
      );
    }
    // 專供「一般關鍵字」的 hay（不包含產品名/條碼）
    function recordToHayGeneral(r){
      return normalizeForSearch(
        [
          r.customerName || "",
          r.phone || "",
          r.email || "",
          r.notes || "",
          r.reserveID || "",
          r.source || "",
          r.staff || "",
          r.etaDate || ""
        ].join(" ")
      );
    }

    // ===== Totals =====
    function updateStats(list){
      const items = list.length;
      let qty = 0;
      for (const r of list) {
        const n = Number(r?.qty ?? 0);
        qty += isNaN(n) ? 0 : n;
      }
      document.getElementById("statItems").textContent = items;
      document.getElementById("statQty").textContent = qty;
    }

    // ===== Load list =====
    async function refreshList() {
      selectedIds.clear();
      document.getElementById("listContainer").innerHTML = `<div class="list-group-item text-muted">載入中…</div>`;
      const snap = await db.collection(COL).orderBy("createdAt","desc").get();
      rawList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      applyFilters();
    }

    function applyFilters() {
      const kwProd = normalizeForSearch(document.getElementById("kwProduct").value || "");
      const kwGen  = normalizeForSearch(document.getElementById("kw").value || "");
      const type = document.getElementById("typeFilter").value;
      const status = document.getElementById("statusFilter").value;
      const priority = document.getElementById("priorityFilter").value;

      viewList = rawList.filter(r => {
        if (type && r.type !== type) return false;
        if (status && r.status !== status) return false;
        if (priority && (r.priority || "normal") !== priority) return false;

        // 先檢查「只搜產品」
        if (kwProd) {
          const hayP = recordToHayProduct(r);
          if (!hayP.includes(kwProd)) return false;
        }
        // 再檢查「一般關鍵字」（不含產品）
        if (kwGen) {
          const hayG = recordToHayGeneral(r);
          if (!hayG.includes(kwGen)) return false;
        }
        return true;
      });

      renderList(viewList);
      updateStats(viewList);
    }

    function rowCheckbox(id) {
      const checked = selectedIds.has(id) ? "checked" : "";
      return `<input class="form-check-input" type="checkbox" ${checked} onchange="toggleSelect('${id}', this.checked)">`;
    }

    async function renderList(list) {
      const container = document.getElementById("listContainer");
      container.innerHTML = "";
      if (!list.length) {
        container.innerHTML = `<div class="list-group-item text-muted">沒有符合條件的紀錄。</div>`;
        return;
      }
      list.forEach(r => {
        const li = document.createElement("div");
        li.className = "list-group-item";
        li.innerHTML = `
          <div class="d-flex align-items-start gap-3">
            <div class="form-check mt-1">
              ${rowCheckbox(r.id)}
            </div>
            <img id="th_${r.id}" class="thumb" alt="img">
            <div class="flex-grow-1">
              <div class="d-flex align-items-center flex-wrap gap-2">
                <strong class="me-2 truncate-1">${escapeHtml(r.productTitle||"(未填產品)")}</strong>
                ${qtyBadge(r.qty)}
                ${statusBadge(r.status || "open")}
                ${typeBadge(r.type)}
                ${r.priority === "high" ? '<span class="badge bg-danger">High</span>' : ""}
              </div>
              <div class="small-muted mt-1">
                客戶：<span class="fw-bold">${escapeHtml(r.customerName||"-")}</span>　
                電話：<span class="fw-bold">${escapeHtml(r.phone||"-")}</span>　
                Email：<span class="fw-bold">${escapeHtml(r.email||"-")}</span>
              </div>
              <div class="small-muted">
                ETA：<span class="fw-bold">${escapeHtml(r.etaDate||"-")}</span>　
                來源：<span class="fw-bold">${escapeHtml(r.source||"-")}</span>　
                經手：<span class="fw-bold">${escapeHtml(r.staff||"-")}</span>　
                預留單號：<span class="fw-bold">${escapeHtml(r.reserveID || "—")}</span>
              </div>
              <div class="text-muted truncate-2">${escapeHtml(r.notes||"")}</div>
              <div class="mt-2 d-flex flex-wrap gap-2">
                <a id="pv_${r.id}" href="#" target="_blank" class="btn btn-sm btn-outline-primary disabled"><i class="bi bi-box-arrow-up-right"></i> 商品頁</a>
                <div class="vr"></div>
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">設為</button>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="quickStatus('${r.id}','open')">Open</a></li>
                    <li><a class="dropdown-item" href="#" onclick="quickStatus('${r.id}','ordered')">Ordered</a></li>
                    <li><a class="dropdown-item" href="#" onclick="quickStatus('${r.id}','received')">Received</a></li>
                    <li><a class="dropdown-item" href="#" onclick="quickStatus('${r.id}','closed')">Closed</a></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="quickStatus('${r.id}','cancelled')">Cancelled</a></li>
                  </ul>
                </div>
                <button class="btn btn-sm btn-outline-dark" onclick="openEdit('${r.id}')"><i class="bi bi-pencil-square"></i> 編輯</button>
                <button class="btn btn-sm btn-outline-danger" onclick="confirmDelete('${r.id}')"><i class="bi bi-trash"></i></button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(li);
        lazyProductBind(r);
      });
    }

    function toggleSelect(id, on) { if (on) selectedIds.add(id); else selectedIds.delete(id); }

    async function lazyProductBind(r) {
      try {
        const prod = await lookupProductByBarcode(r.barcode);
        const th = document.getElementById(`th_${r.id}`);
        const pv = document.getElementById(`pv_${r.id}`);
        if (th && prod?.imageUrl) th.src = prod.imageUrl;
        if (pv && prod?.productUrl) { pv.href = prod.productUrl; pv.classList.remove("disabled"); }
        if (th && !th.src) th.src = "/images/truly_favicon_o1.png";
      } catch {
        const th = document.getElementById(`th_${r.id}`);
        if (th && !th.src) th.src = "/images/truly_favicon_o1.png";
      }
    }

    function escapeHtml(s) {
      return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    async function copyShortLink(evt, id) {
      const btn = evt.currentTarget;
      const url = btn?.dataset?.url;
      if (!url) { alert("短鏈尚未可用（未匹配到商品）。"); return; }
      try {
        await navigator.clipboard.writeText(url);
        const old = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-clipboard-check"></i> 已複製';
        btn.disabled = true;
        setTimeout(()=>{ btn.innerHTML = old; btn.disabled = false; }, 1200);
      } catch(e) { alert("無法複製：" + e); }
    }

    // ===== Create / Edit =====
    function openCreate() {
      document.getElementById("modalTitle").textContent = "新增紀錄";
      document.getElementById("docId").value = "";
      document.getElementById("type").value = "reserve";
      document.getElementById("status").value = "open";
      document.getElementById("priority").value = "normal";
      document.getElementById("source").value = "store";
      ["productTitle","barcode","qty","customerName","phone","email","etaDate","staff","notes","prodSearch"].forEach(id=>{
        const el = document.getElementById(id);
        if (!el) return;
        el.value = (id==="qty") ? 1 : "";
      });
      hideProdResults();
      document.getElementById("auditInfo").textContent = "";
      setTimeout(()=> document.getElementById("prodSearch").focus(), 200);
    }

    function openEdit(id) {
      const r = rawList.find(x => x.id === id);
      if (!r) return;
      document.getElementById("modalTitle").textContent = "編輯紀錄";
      document.getElementById("docId").value = r.id;
      document.getElementById("type").value = r.type || "reserve";
      document.getElementById("status").value = r.status || "open";
      document.getElementById("priority").value = r.priority || "normal";
      document.getElementById("source").value = r.source || "store";
      document.getElementById("productTitle").value = r.productTitle || "";
      document.getElementById("barcode").value = r.barcode || "";
      document.getElementById("qty").value = r.qty || 1;
      document.getElementById("customerName").value = r.customerName || "";
      document.getElementById("phone").value = r.phone || "";
      document.getElementById("email").value = r.email || "";
      document.getElementById("etaDate").value = r.etaDate || "";
      document.getElementById("staff").value = r.staff || "";
      document.getElementById("notes").value = r.notes || "";
      document.getElementById("prodSearch").value = "";
      hideProdResults();
      const created = r.createdAt?.toDate ? r.createdAt.toDate() : (r.createdAt ? new Date(r.createdAt) : null);
      const updated = r.updatedAt?.toDate ? r.updatedAt.toDate() : (r.updatedAt ? new Date(r.updatedAt) : null);
      document.getElementById("auditInfo").textContent =
        `建立：${created? created.toLocaleString(): "-"}　更新：${updated? updated.toLocaleString(): "-"}`;
      new bootstrap.Modal(document.getElementById("editModal")).show();
    }

    function validateForm() {
      const form = document.getElementById("editForm");
      if (!form.checkValidity()) { form.classList.add('was-validated'); return false; }
      return true;
    }

    async function saveRecord(e) {
      e.preventDefault();
      if (!validateForm()) return;

      const id = document.getElementById("docId").value.trim();
      const payload = {
        type: document.getElementById("type").value,
        status: document.getElementById("status").value,
        priority: document.getElementById("priority").value || "normal",
        source: document.getElementById("source").value || "store",
        productTitle: document.getElementById("productTitle").value.trim(),
        barcode: String(document.getElementById("barcode").value).trim(),
        qty: Number(document.getElementById("qty").value || 1),
        customerName: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        etaDate: document.getElementById("etaDate").value,
        staff: document.getElementById("staff").value.trim(),
        notes: document.getElementById("notes").value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!id) {
        let reserveID = genReserveID();
        for (let i = 0; i < 5; i++) {
          const dup = await db.collection(COL).where("reserveID","==",reserveID).limit(1).get();
          if (dup.empty) break;
          reserveID = genReserveID();
        }
        payload.reserveID = reserveID;
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection(COL).add(payload);
      } else {
        await db.collection(COL).doc(id).set(payload, { merge:true });
      }

      bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
      refreshList();
    }

    // ===== Quick status / Delete =====
    async function quickStatus(id, status) {
      await db.collection(COL).doc(id).set({
        status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      refreshList();
    }

    function confirmDelete(id) {
      delTargetId = id;
      new bootstrap.Modal(document.getElementById("confirmDelModal")).show();
    }

    document.getElementById("btnDoDelete").addEventListener("click", async ()=>{
      if (!delTargetId) return;
      await db.collection(COL).doc(delTargetId).delete();
      delTargetId = null;
      bootstrap.Modal.getInstance(document.getElementById("confirmDelModal")).hide();
      refreshList();
    });

    // ===== Bulk ops =====
    async function bulkChangeStatus(status) {
      if (!selectedIds.size) { alert("請先勾選項目。"); return; }
      const batch = db.batch();
      selectedIds.forEach(id=>{
        const ref = db.collection(COL).doc(id);
        batch.set(ref, { status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
      });
      await batch.commit();
      selectedIds.clear();
      refreshList();
    }

    // ===== Export CSV =====
    function exportCSV() {
      const header = ["id","reserveID","type","status","priority","source","productTitle","barcode","qty","customerName","phone","email","etaDate","staff","notes","createdAt","updatedAt"];
      const rows = [header];
      (viewList.length? viewList: rawList).forEach(r=>{
        const cAt = r.createdAt?.toDate ? r.createdAt.toDate() : (r.createdAt? new Date(r.createdAt): "");
        const uAt = r.updatedAt?.toDate ? r.updatedAt.toDate() : (r.updatedAt? new Date(r.updatedAt): "");
        rows.push([
          r.id, r.reserveID||"", r.type||"", r.status||"", r.priority||"", r.source||"",
          r.productTitle||"", r.barcode||"", r.qty||"",
          r.customerName||"", r.phone||"", r.email||"", r.etaDate||"", r.staff||"",
          r.notes||"", cAt? cAt.toISOString():"", uAt? uAt.toISOString():""
        ]);
      });
      const csv = rows.map(r=> r.map(v=> `"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\r\n");
      const bom = "\uFEFF";
      const blob = new Blob([bom + csv], {type:"text/csv;charset=utf-8;"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "reservations_export.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ===== Product Search (modal picker) =====
    async function preloadProducts() {
      const snap = await db.collection(PRODUCT_COL).get();
      productsCache = snap.docs.map(d => {
        const x = d.data();
        return {
          Title: x.Title || "",
          ProductNameEng: x.ProductNameEng || x.Title || "",
          ProductNameChi: x.ProductNameChi || "",
          Barcode: String(x.Barcode || "").trim(),
          ImageURL: x["Image URL"] || "",
          ProductURL: x["Product URL"] || x.ProductURL || "",
          Handle: (x.Handle || x.handle || ""),
        };
      });
    }

    function filterProducts(term) {
      term = normalizeForSearch(term);
      if (!term || term.length < 2) return [];
      const res = [];
      for (const p of productsCache) {
        const eng = normalizeForSearch(p.ProductNameEng);
        const chi = normalizeForSearch(p.ProductNameChi);
        const ttl = normalizeForSearch(p.Title);
        const bc  = normalizeForSearch(p.Barcode);
        if (eng.includes(term) || chi.includes(term) || ttl.includes(term) || bc.includes(term)) {
          res.push(p);
          if (res.length >= 20) break;
        }
      }
      return res;
    }

    function showProdResults(list) {
      const box = document.getElementById("prodResults");
      if (!list.length) { hideProdResults(); return; }
      prodActiveIndex = -1;
      box.innerHTML = list.map((p, i)=>`
        <div class="prod-item" data-idx="${i}">
          <div class="d-flex align-items-start gap-2">
            <img src="${p.ImageURL || '/images/truly_favicon_o1.png'}" class="rounded" style="width:40px;height:40px;object-fit:contain;border:1px solid #eee;">
            <div class="flex-grow-1">
              <div class="fw-semibold truncate-1">${escapeHtml(p.ProductNameEng || p.Title)}</div>
              <div class="text-muted small truncate-1">${escapeHtml(p.ProductNameChi || "")}</div>
              <div class="small"><span class="badge bg-light text-dark prod-badge">條碼: ${escapeHtml(p.Barcode||'-')}</span></div>
            </div>
          </div>
        </div>
      `).join("");
      box.style.display = "block";
      [...box.querySelectorAll(".prod-item")].forEach(el=>{
        el.addEventListener("click", ()=>{
          const idx = Number(el.dataset.idx);
          chooseProduct(list[idx]);
        });
      });
    }
    function hideProdResults() {
      const box = document.getElementById("prodResults");
      box.style.display = "none";
      box.innerHTML = "";
      prodActiveIndex = -1;
    }
    function chooseProduct(p) {
      if (!p) return;
      document.getElementById("productTitle").value = p.ProductNameEng || p.Title || "";
      if (p.ProductNameChi) {
        const curNotes = document.getElementById("notes").value.trim();
        if (!curNotes.includes(p.ProductNameChi)) {
          document.getElementById("notes").value = (curNotes? (curNotes + " ") : "") + p.ProductNameChi;
        }
      }
      document.getElementById("barcode").value = p.Barcode || ""
      document.getElementById("prodSearch").value = "";
      hideProdResults();
      setTimeout(()=> document.getElementById("qty").focus(), 50);
    }
    function debounce(fn, wait=150){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }
    const onProdSearchInput = debounce(()=>{
      const term = document.getElementById("prodSearch").value.trim();
      const list = filterProducts(term);
      showProdResults(list);
    }, 200);
    function onProdSearchKeydown(e) {
      const box = document.getElementById("prodResults");
      if (box.style.display !== "block") return;
      const items = [...box.querySelectorAll(".prod-item")];
      if (!items.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        prodActiveIndex = (e.key === "ArrowDown")
          ? (prodActiveIndex + 1) % items.length
          : (prodActiveIndex - 1 + items.length) % items.length;
        items.forEach((el,i)=> el.classList.toggle("active", i===prodActiveIndex));
        items[prodActiveIndex].scrollIntoView({block:"nearest"});
      } else if (e.key === "Enter") {
        e.preventDefault();
        const list = filterProducts(document.getElementById("prodSearch").value.trim());
        if (list.length && prodActiveIndex >= 0) chooseProduct(list[prodActiveIndex]);
      } else if (e.key === "Escape") {
        hideProdResults();
      }
    }
    function prodSearchBlur(){ setTimeout(()=> hideProdResults(), 150); }

    // ===== Init =====
    async function init() {
      await Promise.all([preloadProducts(), refreshList()]);
      const ps = document.getElementById("prodSearch");
      ps.addEventListener("input", onProdSearchInput);
      ps.addEventListener("keydown", onProdSearchKeydown);
      ps.addEventListener("blur", prodSearchBlur);
    }
    init();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
